<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DayMate Settings</title>
  <link rel="stylesheet" href="config.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>DayMate</h1>
      <p>Choose your theme and the daily info you want to see.</p>
    </header>

    <form id="settings-form" class="card">
      <label for="theme">Theme</label>
      <select id="theme" name="theme"></select>

      <label for="slot_1_metric">Metric Slot 1</label>
      <select id="slot_1_metric" name="slot_1_metric"></select>

      <label for="slot_2_metric">Metric Slot 2</label>
      <select id="slot_2_metric" name="slot_2_metric"></select>

      <label for="slot_3_metric">Metric Slot 3</label>
      <select id="slot_3_metric" name="slot_3_metric"></select>

      <label for="slot_4_metric">Metric Slot 4</label>
      <select id="slot_4_metric" name="slot_4_metric"></select>

      <label class="toggle-row" for="show_leading_zero">
        <span>Show Leading Zero</span>
        <input id="show_leading_zero" name="show_leading_zero" type="checkbox" />
      </label>

      <div class="actions">
        <button type="button" id="cancel" class="secondary">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </main>
  <script src="config.js"></script>
</body>
</html>
